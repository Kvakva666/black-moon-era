<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коты-Воители: Эра Черной Луны</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0b0b; color: #e0e0e0; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .game-window { width: 100%; max-width: 450px; background: #141414; border: 2px solid #3a1c5c; border-radius: 12px; padding: 15px; box-sizing: border-box; }
        .screen { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #3a1c5c; }
        .loc-img { width: 100%; height: 100%; object-fit: cover; display: block; background: #111; }
        .loc-text { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); padding: 10px; font-size: 13px; text-align: center; border-top: 1px solid #3a1c5c; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; background: #1c1c1c; padding: 10px; border-radius: 6px; font-size: 13px; }
        .bar { background: #2b2b2b; height: 10px; border-radius: 4px; overflow: hidden; margin-top: 4px; position: relative; }
        .fill { height: 100%; width: 100%; transition: width 0.3s, background-color 0.3s, box-shadow 0.3s; }
        .btn { background: #3a1c5c; color: #fff; border: 1px solid #5c2d91; padding: 12px; margin: 6px 0; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; box-sizing: border-box; }
        .btn:hover { background: #4c2577; }
        .btn-move { background: #1c2d5a; border-color: #294488; padding: 10px; font-size: 13px; margin: 4px 0; width: 100%; text-align: left; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; border-style: solid; border-width: 1px; }
        .btn-move:hover { background: #263d7a; }
        .log { background: #080808; border: 1px solid #222; height: 110px; overflow-y: auto; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 10px; color: #a0a0a0; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="game-window">
    <div class="screen">
        <img id="locImg" class="loc-img" src="" alt="Локация">
        <div id="locDesc" class="loc-text">Загрузка мира вечной ночи...</div>
    </div>
    <div class="stats">
        <div>❤️ Здоровье: <span id="txtHp">100</span>/100<div class="bar"><div id="barHp" class="fill" style="background:#cf1414;"></div></div></div>
        <div>🍖 Сытость: <span id="txtHunger">100</span>/100<div class="bar"><div id="barHunger" class="fill" style="background:#f1c40f;"></div></div></div>
        <div style="grid-column: span 2; border-top: 1px solid #222; padding-top: 5px;">
            🎒 В лапах: <b id="txtInv" style="color:#1abc9c;">Ничего</b><br>
            ⏳ Возраст: <span id="txtAge" style="color:#3498db; font-weight:bold;">0 лун (0/5 дн.)</span><br>
            ⚠️ Состояние: <span id="txtStatus">Здоров</span>
        </div>
    </div>
    <div id="actionArea">
        <button class="btn" onclick="gameAction('hunt')">🐾 Поохотиться (-10 сытости)</button>
        <button class="btn" onclick="gameAction('eat')">🍖 Съесть мышь (+25 сытости)</button>
        <div id="specialAction"></div>
    </div>
    <h4 style="margin: 10px 0 5px 0; font-size: 12px; color: #666;">ПЕРЕМЕЩЕНИЕ:</h4>
    <div id="navigationArea" style="display: block;"></div>
    <div class="log" id="gameLog"></div>
</div>

<script>
    const locations = {
        "Полянка на Нейтралках": {
            img: "", 
            desc: "Полянка. Вечный мрак. Трава светится ядовито-зеленым, а в небе застыла туманная пыль... Опасно!",
            exits: ["Старое Гнездо Двуногих", "Подземный Коллектор", "Ствол Дерева", "Заброшенная Radioстанция"]
        },
        "Ствол Дерева": {
            img: "",
            desc: "Вертикальный ствол гигантского дерева. Толстая древняя кора покрыта фиолетовым мхом. Лапы немного скользят.",
            exits: ["Полянка на Нейтралках", "Гигантское Дупло", "Нижние прочные ветви"]
        },
        "Гигантское Дупло": {
            img: "",
            desc: "Лагерь Племени Теплого Света. Огромное уютное дупло. Коты греются в коконах из фиолетовых светлячков. Здесь рождаются крылатые котята.",
            exits: ["Ствол Дерева"]
        },
        "Нижние прочные ветви": {
            img: "",
            desc: "Толстые ветви Племени Тёплого Света. На кору налипла изморозь. Здесь можно искать полезный целебный мох для Племени.",
            exits: ["Ствол Дерева"]
        },
        "Старое Гнездо Двуногих": {
            img: "",
            desc: "Лагерь Племени Пылающего Огня. Разрушенный дом Двуногих, где воители греются углищами. Во дворе лежат ледяные цветы.",
            exits: ["Полянка на Нейтралках"]
        },
        "Подземный Коллектор": {
            img: "",
            desc: "Лагерь Глубинного Племени. Заброшенный каменный коллектор под землей. Здесь нет ветра, все коты белые, слепые, но обладают безупречным слухом.",
            exits: ["Полянка на Нейтралках", "Лабиринт темных нор"]
        },
        "Лабиринт темных нор": {
            img: "",
            desc: "Опасные подземные туннели вне лагеря Глубинного племени. Здесь абсолютная тьма, но благодаря усам тут стопроцентная охота!",
            exits: ["Подземный Коллектор"]
        },
        "Заброшенная Radioстанция": {
            img: "",
            desc: "Старая полуразрушенная вышка Двуногих на самом краю Нейтралок. Кругом протянуты ржавые провода и гудят старые приёмники. Здесь живёт Тэфи (Птичка Радио), которая ловит архивные сигналы и музыку из далёкого прошлого...",
            exits: ["Полянка на Нейтралках"]
        }
    };

    let cat = { 
        location: "Полянка на Нейтралках", 
        hp: 100, 
        hunger: 100, 
        mice: 0, 
        coals: 0, 
        moss: 0, 
        mutation: 0,
        age_days: 0,
        age_moons: 0,
        sticks: 0,
        leaves: 0,
        trash: 0,
        fireflies: 0,
        quest_step: 1,
        has_toy: false,
        has_costume: false,
        has_nest: false
    };

    function loadGame() {
        let save = localStorage.getItem('github_cat_save');
        if (save) {
            try {
                cat = JSON.parse(save);
                if (cat.age_days === undefined) cat.age_days = 0;
                if (cat.age_moons === undefined) cat.age_moons = 0;
                if (cat.sticks === undefined) cat.sticks = 0;
                if (cat.leaves === undefined) cat.leaves = 0;
                if (cat.trash === undefined) cat.trash = 0;
                if (cat.fireflies === undefined) cat.fireflies = 0;
                if (cat.quest_step === undefined) cat.quest_step = 1;
                if (cat.has_toy === undefined) cat.has_toy = false;
                if (cat.has_costume === undefined) cat.has_costume = false;
                if (cat.has_nest === undefined) cat.has_nest = false;
            } catch(e) {
                console.error("Ошибка загрузки сохранения, сброс.");
            }
        }
        if (cat.hp <= 0) {
            resetGame();
        } else {
            updateUI();
            log("Вы очнулись во вечной тьме.");
        }
    }

    function saveGame() { 
        localStorage.setItem('github_cat_save', JSON.stringify(cat)); 
    }

    function log(msg) {
        let box = document.getElementById('gameLog');
        if(box) { 
            box.innerHTML += `<div>• ${msg}</div>`; 
            box.scrollTop = box.scrollHeight; 
        }
    }

    function resetGame() {
        alert("🚨 Вы потеряли всё здоровье... Мир вечной ночи поглотил ваш разум. Начните приключение заново!");
        cat = { 
            location: "Полянка на Нейтралках", 
            hp: 100, 
            hunger: 100, 
            mice: 0, 
            coals: 0, 
            moss: 0, 
            mutation: 0,
            age_days: 0,
            age_moons: 0,
            sticks: 0,
            leaves: 0,
            trash: 0,
            fireflies: 0,
            quest_step: 1,
            has_toy: false,
            has_costume: false,
            has_nest: false
        };
        saveGame();
        updateUI();
        log("Вы возродились на Полянке на Нейтралках. Параметры сброшены.");
    }

    function checkHealth() {
        if (cat.has_nest && cat.hunger <= 0) {
            return false;
        }
        if (cat.hp <= 0) {
            cat.hp = 0;
            resetGame();
            return true;
        }
        return false;
    }

    function passDay() {
        cat.age_days++;
        if (cat.age_days >= 5) {
            cat.age_days = 0;
            cat.age_moons++;
            log(`⏳ Прошло 5 дней. Вы повзрослели! Ваш текущий возраст: ${cat.age_moons} лун.`);
            if (cat.age_moons >= 6) {
                log("🦅 Поздравляем! Вам исполнилось 6 лун. Вы автоматически стали учеником и теперь можете выходить из лагеря!");
            }
        }
    }

    function updateUI() {
        let loc = locations[cat.location];
        if (!loc) {
            cat.location = "Полянка на Нейтралках";
            loc = locations[cat.location];
        }

        document.getElementById('locImg').src = loc.img;
        document.getElementById('locDesc').innerText = loc.desc;
        document.getElementById('txtHp').innerText = cat.hp;
        document.getElementById('barHp').style.width = cat.hp + "%";
        document.getElementById('txtHunger').innerText = cat.hunger;
        
        let hungerBar = document.getElementById('barHunger');
        hungerBar.style.width = cat.hunger + "%";
        
        if (cat.hunger === 100) {
            hungerBar.style.backgroundColor = "#9400d3";
            hungerBar.style.boxShadow = "0 0 10px #8a2be2, 0 0 15px #ba55d3";
        } else {
            hungerBar.style.backgroundColor = "#f1c40f";
               hungerBar.style.backgroundColor = "#f1c40f";
            hungerBar.style.boxShadow = "none";
        }
        
        document.getElementById('txtAge').innerText = `${cat.age_moons} лун (${cat.age_days}/5 дн.)`;
        
        let invText = [];
        if (cat.mice > 0) invText.push(`Мышь (${cat.mice} шт.)`);
        if (cat.coals > 0) invText.push(`Угли (${cat.coals} шт.)`);
        if (cat.moss > 0) invText.push(`Мох (${cat.moss} шт.)`);
        if (cat.sticks > 0) invText.push(`Палка (${cat.sticks} шт.)`);
        if (cat.leaves > 0) invText.push(`Лист (${cat.leaves} шт.)`);
        if (cat.trash > 0) invText.push(`Мусор (${cat.trash} шт.)`);
        if (cat.fireflies > 0) invText.push(`Светлячок (${cat.fireflies} шт.)`);
        if (cat.has_toy) invText.push("🧸 Защитная Игрушка Смерти");
        if (cat.has_costume) invText.push("🍁 Нарядный Костюм из листьев и ягод");
        if (cat.has_nest) invText.push("🪶 Пуховое Гнёздышко Смерти");
        
        document.getElementById('txtInv').innerText = invText.length > 0 ? invText.join(', ') : "Ничего";
        
        let statusTag = document.getElementById('txtStatus');
        if (cat.mutation === 3 && !cat.has_toy) { 
            statusTag.innerText = "3 Стадия: БЕЗУМИЕ 💀"; 
            statusTag.style.color = "#e74c3c"; 
        } else if (cat.mutation === 3 && cat.has_toy) {
            statusTag.innerText = "3 Стадия: БЕЗУМИЕ ЗАБЛОКИРОВАНО 🧸"; 
            statusTag.style.color = "#3498db";
        } else if (cat.mutation === 2) { 
            statusTag.innerText = "2 Стадия: Искажающий Дар 👁️ (Рога!)"; 
            statusTag.style.color = "#9b59b6"; 
        } else if (cat.mutation === 1) { 
            statusTag.innerText = "1 Стадия: Черный Кашель 🦠"; 
            statusTag.style.color = "#f39c12"; 
        } else { 
            statusTag.innerText = "Здоров"; 
            statusTag.style.color = "#2ecc71"; 
        }
        
        let specArea = document.getElementById('specialAction');
        specArea.innerHTML = "";

        if (cat.location === "Старое Гнездо Двуногих") {
            specArea.innerHTML = `<button class="btn" style="background:#e67e22; border-color:#d35400;" onclick="gameAction('search_coals')">🔥 Искать угли в печи</button>`;
        } else if (cat.location === "Нижние прочные ветви") {
            specArea.innerHTML = `<button class="btn" style="background:#27ae60; border-color:#219653;" onclick="gameAction('gather_moss')">🌿 Собирать лечебный мох</button>`;
        } else if (cat.mutation > 0 && cat.coals > 0) {
            specArea.innerHTML = `<button class="btn" style="background:#c0392b; border-color:#962d22;" onclick="gameAction('burn_wound')">🩸 Прижечь заразу углями</button>`;
        }

        if (cat.location === "Гигантское Дупло" && cat.age_moons < 6) {
            let questHtml = `<div style="border: 1px dashed #3a1c5c; padding: 10px; margin-top: 10px; border-radius: 6px; background:#0d0d0d;">`;
            questHtml += `<h5 style="margin:0 0 5px 0; color:#9b59b6; font-size:13px;">💀 Тёмный уголок Смерти:</h5>`;
            
            if (cat.quest_step === 1) {
                questHtml += `<div style="font-size:12px; margin-bottom:5px;"><b>Квест 1:</b> Принеси палку и 4 листочка.<br>(У тебя: Палок: ${cat.sticks}/1, Листьев: ${cat.leaves}/4)</div>`;
                questHtml += `<button class="btn" style="background:#27ae60; padding:8px; font-size:12px; margin:2px 0;" onclick="gameAction('complete_q1')">🎁 Сдать 1-й квест</button>`;
            } else if (cat.quest_step === 2) {
                questHtml += `<div style="font-size:12px; margin-bottom:5px;"><b>Квест 2:</b> Принеси 10 единиц мусора.<br>(У тебя: Мусора: ${cat.trash}/10)</div>`;
                questHtml += `<button class="btn" style="background:#27ae60; padding:8px; font-size:12px; margin:2px 0;" onclick="gameAction('complete_q2')">🎁 Сдать 2-й квест</button>`;
            } else if (cat.quest_step === 3) {
                questHtml += `<div style="font-size:12px; margin-bottom:5px;"><b>Квест 3:</b> Поймай 3 фиолетовых светлячка на стенах.<br>(У тебя: Светлячков: ${cat.fireflies}/3)</div>`;
                questHtml += `<button class="btn" style="background:#27ae60; padding:8px; font-size:12px; margin:2px 0;" onclick="gameAction('complete_q3')">🎁 Сдать 3-й квест</button>`;
            } else {
                questHtml += `<div style="color:#2ecc71; font-size:12px;">🌟 Вы прошли все три квеста Смерти для котят лагеря!</div>`;
            }
            
            questHtml += `<button class="btn" style="background:#16a085; padding:8px; font-size:12px; margin-top:5px;" onclick="gameAction('search_duplo')">🐾 Искать ресурсы на полу лагеря</button>`;
            questHtml += `</div>`;
            specArea.innerHTML += questHtml;
        }

        let navArea = document.getElementById('navigationArea');
        navArea.innerHTML = "";
        loc.exits.forEach(exit => {
            navArea.innerHTML += `<button class="btn-move" onclick="moveTo('${exit}')">🐾 Перейти в: ${exit}</button>`;
        });
    }
